version: '3.8'

services:

  mongo:
    image: mongo:latest
    container_name: my-mongo
    ports:
      - "27017:27017"

  app:
    build: .
    container_name: event-platform-container
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/event_platform